[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "procedural-terrain-shader-forge"
version = "0.6.3"
description = "Plugin-host procedural terrain generator with a GLSL shader pipeline"
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "the forge crew" }]
keywords = ["terrain", "procedural", "shaders", "glsl", "heightmap", "erosion"]

dependencies = [
    "numpy>=1.26,<3",
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "msgpack>=1.0",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
native = [
    "pybind11>=2.12",
]

[project.scripts]
forge = "forge_host.bootstrap:main"
forge-bake = "services.bake_service:cli_main"

[tool.hatch.build.targets.wheel]
packages = [
    "forge_host",
    "terrain_core",
    "shader_pipeline",
    "contracts",
    "services",
    "models",
    "utils",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["terrain_core", "contracts", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"